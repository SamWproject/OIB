<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#F6F1E8">
<title>Encore — Live Interactive Presentation</title>
<style>
:root{
  --bg:#F6F1E8;--paper:#FFFDF9;--card:#FFFFFF;--caramel:#D9B98C;--caramel2:#EAD9C0;
  --border:#E5D8C8;--text:#24303A;--muted:#6F746F;--faint:#9E9C95;
  --blue:#203A4D;--blueSoft:#E8EEF0;--gold:#B58748;--green:#557A64;--red:#A95147;--chip:#F0EAE1;
}
*{box-sizing:border-box} html,body,#app{margin:0;width:100%;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
body{background:var(--bg)}button,input,textarea{font:inherit}button{cursor:pointer;border:0}button:disabled{cursor:default;opacity:.42}
.app{min-height:100vh;display:flex;flex-direction:column}.hidden{display:none!important}
.topbar{height:60px;background:rgba(255,253,249,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 18px;gap:12px;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:9px;font-weight:800}.brandmark{width:29px;height:29px;border-radius:9px;background:var(--blue);color:#fff;display:grid;place-items:center}
.tabs{display:flex;gap:3px;background:var(--chip);padding:4px;border-radius:999px}.tab{padding:7px 12px;border-radius:999px;background:transparent;color:var(--muted);font-size:12px;font-weight:700}.tab.active{background:var(--blue);color:#fff}
.top-actions{display:flex;gap:7px;align-items:center}.status{font-size:11px;padding:6px 9px;border-radius:999px;background:var(--chip);color:var(--muted);font-weight:750}.status.online{background:#E8F1EA;color:var(--green)}
.iconbtn,.smallbtn{background:var(--chip);color:var(--text);border:1px solid var(--border);border-radius:9px;padding:8px 11px;font-weight:700;font-size:12px}
.main{display:flex;flex:1;min-height:0}.split .presenter,.split .audience{width:50%}.presenter,.audience{display:flex;min-height:calc(100vh - 60px)}.presenter{border-right:1px solid var(--border)}
.sidebar{width:230px;flex:none;background:var(--paper);border-right:1px solid var(--border);display:flex;flex-direction:column}.rundown{padding:16px 14px 8px;font-size:11px;font-weight:850;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}.slides{padding:0 9px;overflow:auto;flex:1}
.slideitem{width:100%;display:flex;gap:8px;align-items:flex-start;text-align:left;padding:10px;border-radius:10px;background:transparent;color:var(--muted);margin-bottom:3px}.slideitem.active{background:var(--blueSoft);color:var(--text)}.slide-num{font-size:10px;font-weight:850;width:17px;color:var(--faint)}.slideitem.active .slide-num{color:var(--blue)}.slide-title{font-size:12px;line-height:1.35;flex:1}.delete{color:var(--red);font-size:14px;opacity:0}.slideitem:hover .delete{opacity:1}
.addbox{border-top:1px solid var(--border);padding:11px}.addgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.addbtn{background:var(--chip);border-radius:8px;padding:9px 3px;font-size:10px;font-weight:750}
.console{flex:1;overflow:auto}.hero{position:relative;min-height:270px;border-bottom:1px solid var(--border);padding:47px 40px 32px;overflow:hidden;background:linear-gradient(145deg,#FFFDF9 0%,#F6F1E8 75%)}.hero:before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,var(--blue),var(--caramel),var(--gold))}
.hero h1{font-family:Georgia,"Times New Roman",serif;font-size:38px;font-weight:650;line-height:1.08;margin:0 0 13px;max-width:820px;color:var(--text)}.hero p{font-size:16px;color:var(--muted);max-width:760px;white-space:pre-wrap;line-height:1.55}
.content{padding:20px 24px;max-width:1050px}.row{display:flex;gap:12px;align-items:center;justify-content:space-between}.section-title{font-size:14px;font-weight:850;margin:0 0 9px}.invite,.metrics,.feed,.online-panel{background:var(--card);border:1px solid var(--border);border-radius:15px}
.invite{padding:15px 17px;background:linear-gradient(135deg,#F3E9DA,#E9E2D7);margin-bottom:16px}.room{font-size:26px;letter-spacing:.14em;font-weight:900}.muted{color:var(--muted)}.metrics{display:grid;grid-template-columns:1fr 1fr 1fr;margin-bottom:19px}.metric{padding:15px;border-right:1px solid var(--border)}.metric:last-child{border:0}.metric.center{text-align:center}.metric.right{text-align:right}.metric-label{font-size:11px;color:var(--muted);margin-bottom:4px}.metric-value{font-weight:850}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.action{padding:10px 14px;border-radius:10px;background:var(--chip);font-size:12px;font-weight:750;border:1px solid transparent}.action.primary{background:var(--blue);color:#fff}.action.caramel{background:var(--caramel2);color:#63492B}
.reactbar{display:flex;gap:8px}.react{width:42px;height:42px;border-radius:50%;background:var(--chip);font-size:19px}.feed{margin-top:20px}.feed-head{padding:13px 15px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between}.feed-body{max-height:230px;overflow:auto}.feeditem{padding:10px 15px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:12px;font-size:12px}.feeditem:last-child{border:0}.feedkind{font-weight:850;margin-bottom:3px}.time{color:var(--faint);font-size:11px;white-space:nowrap}
.preview-poll{max-width:680px}.barrow{margin:13px 0}.barlabel{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}.bar{height:12px;background:#E9DFD1;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--blue),#3D5A6B);border-radius:99px;transition:width .35s}
.wordcloud{display:flex;flex-wrap:wrap;align-items:center;gap:7px 14px;max-width:780px}.word{font-family:Georgia,"Times New Roman",serif;font-weight:700;line-height:1}.empty{color:var(--faint);font-size:13px}
.audience{background:var(--bg);flex-direction:column}.audience-center{flex:1;display:grid;place-items:center;padding:28px;overflow:auto}.audience-card{width:min(540px,100%);background:var(--paper);border:1px solid var(--border);border-radius:20px;padding:29px;box-shadow:0 15px 40px rgba(61,45,30,.06)}.audience-card h2{font-family:Georgia,"Times New Roman",serif;font-size:29px;font-weight:650;margin:7px 0 18px}.audience-card .type{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:850;color:var(--blue)}.audience-card p{color:var(--muted);line-height:1.55}.audience-card input,.audience-card textarea,.setup-modal input,.setup-modal textarea{width:100%;background:#fff;border:1px solid var(--border);border-radius:9px;padding:10px;outline:none;color:var(--text);margin:5px 0}.poll-option{width:100%;text-align:left;padding:13px;border-radius:11px;background:var(--chip);border:1px solid var(--border);margin:5px 0;display:flex;justify-content:space-between;font-weight:700}.poll-option.selected{background:var(--blue);border-color:var(--blue);color:#fff}.reaction-footer{border-top:1px solid var(--border);background:var(--paper);padding:13px;display:flex;justify-content:center;gap:8px}
.join{max-width:405px}.join .code{text-align:center;font-weight:850;letter-spacing:.13em}.join .name{text-align:left;letter-spacing:normal;font-weight:400}
.float{position:fixed;bottom:90px;font-size:25px;animation:float 2.2s ease-out forwards;pointer-events:none;z-index:150}@keyframes float{0%{transform:translateY(0) scale(.8);opacity:0}15%{opacity:1}100%{transform:translateY(-170px) scale(1.1);opacity:0}}
.presentation{position:fixed;inset:0;background:var(--bg);z-index:100;color:var(--text);display:flex;align-items:center;justify-content:center;overflow:hidden}.presentation:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 10% 15%,rgba(217,185,140,.27),transparent 34%),radial-gradient(circle at 90% 80%,rgba(32,58,77,.08),transparent 38%)}
.presentation .stage{position:relative;width:92vw;height:88vh;background:rgba(255,253,249,.92);border:1px solid #E0CFB9;border-radius:34px;box-shadow:0 30px 90px rgba(72,48,24,.12);display:flex;align-items:center;justify-content:center;padding:7vw;overflow:auto}.presentation .stage:before{content:"";position:absolute;top:0;left:0;right:0;height:9px;background:linear-gradient(90deg,var(--blue),var(--caramel),var(--gold))}
.presentation .stage-inner{width:min(1350px,100%);position:relative}.presentation h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(44px,6vw,92px);font-weight:650;line-height:1.03;margin:0 0 30px;color:var(--text)}.presentation p{font-size:clamp(20px,2.15vw,31px);line-height:1.5;color:var(--muted);white-space:pre-wrap}.presentation .preview-poll{max-width:980px}.presentation .barlabel{font-size:clamp(17px,1.8vw,27px);margin-bottom:9px}.presentation .bar{height:20px}.presentation .barrow{margin:22px 0}.presentation .wordcloud{max-width:1100px;gap:15px 24px}.presentation .word{font-size:clamp(22px,3.2vw,54px)!important;color:var(--blue)}
.present-controls{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:7px;background:rgba(255,253,249,.92);border:1px solid var(--border);padding:8px;border-radius:14px;opacity:.18;transition:opacity .2s;box-shadow:0 8px 24px rgba(0,0,0,.08)}.presentation:hover .present-controls{opacity:1}.present-controls button{background:var(--chip);color:var(--text);border-radius:8px;padding:9px 13px;font-weight:750}.present-counter{position:fixed;top:25px;right:31px;color:var(--muted);font-size:13px;font-weight:800}
.modal-wrap{position:fixed;inset:0;background:rgba(31,35,37,.36);display:grid;place-items:center;padding:20px;z-index:300}.setup-modal{width:min(680px,100%);max-height:90vh;overflow:auto;background:var(--paper);border:1px solid var(--border);border-radius:22px;padding:25px;box-shadow:0 30px 90px rgba(0,0,0,.18)}.setup-modal h2{font-family:Georgia,"Times New Roman",serif;font-size:29px;margin:0 0 8px}.setup-modal h3{font-size:14px;margin:21px 0 7px}.setup-modal p,.setup-modal li{font-size:12.5px;line-height:1.55;color:var(--muted)}.setup-modal textarea{min-height:150px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}.setup-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.notice{background:#F5EBDD;border:1px solid #E5CFB1;border-radius:11px;padding:11px 13px;font-size:12px;color:#705438}.online-panel{padding:14px 16px;margin-bottom:17px}.online-panel code{font-size:11px;background:var(--chip);padding:2px 5px;border-radius:5px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 14px;border-radius:10px;font-size:12px;z-index:400}
@media(max-width:900px){.split .presenter,.split .audience{width:100%}.split .audience{display:none}.sidebar{width:185px}.top-actions .optional{display:none}.status{display:none}}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import { getDatabase, ref, set, update, get, onValue, onChildAdded, push, serverTimestamp, remove } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

const EMOJIS=["❤️","👍","👏","🔥","🎉","😮"];
const LS="encore_live_v3", CFGKEY="encore_firebase_config_v1";
const id=()=>crypto.randomUUID?crypto.randomUUID():"id_"+Date.now()+"_"+Math.random().toString(36).slice(2);
const now=()=>new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const freshSlides=()=>[
 {id:id(),type:"content",title:"Welcome to Encore",body:"A live presentation where your audience can vote, respond, and react in real time."},
 {id:id(),type:"poll",title:"Which part of the roadmap excites you most?",options:[{id:id(),text:"Mobile app"},{id:id(),text:"API access"},{id:id(),text:"Offline mode"}]},
 {id:id(),type:"freeform",title:"Describe this session in one word",prompt:"One word or a short phrase — repeated favorites grow larger."}
];

let state={slides:freshSlides(),current:0,view:"split",feed:[{id:id(),kind:"system",text:"Session started.",ts:now()}],localVotes:{},localResponses:{},joinedName:"",audienceJoined:false,online:false,room:null,presenter:false,participants:0,remoteVotes:{},remoteResponses:{}};
try{const x=JSON.parse(localStorage.getItem(LS));if(x?.slides?.length)state={...state,...x,online:false,room:null,presenter:false,participants:0,remoteVotes:{},remoteResponses:{},audienceJoined:false};}catch{}
let fb=null, auth=null, db=null, uid=null, firebaseConfig=null, listenersStarted=false, remoteEventKeys=new Set();

function saveLocal(){const keep={slides:state.slides,current:state.current,view:state.view,feed:state.feed.slice(0,40),localVotes:state.localVotes,localResponses:state.localResponses};try{localStorage.setItem(LS,JSON.stringify(keep))}catch{}}
function toast(t){const x=document.createElement("div");x.className="toast";x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),1900)}
function current(){return state.slides[state.current]||null}
function roomCode(){return state.room||"------"}
function responseTexts(slideId){
 if(state.online){
   const perUser=state.remoteResponses?.[slideId]||{};
   return Object.values(perUser).flatMap(v=>v?Object.values(v).map(x=>typeof x==="string"?x:x?.text).filter(Boolean):[]);
 }
 return (state.localResponses[slideId]||[]);
}
function voteMap(slideId){return state.online?(state.remoteVotes?.[slideId]||{}):(state.localVotes?.[slideId]||{})}
function pollCounts(s){
 const votes=Object.values(voteMap(s.id));
 const map={};s.options.forEach(o=>map[o.id]=0);votes.forEach(v=>{if(map[v]!==undefined)map[v]++});return map;
}
function totalInputs(){
 let n=0;state.slides.forEach(s=>{if(s.type==="poll")n+=Object.keys(voteMap(s.id)).length;if(s.type==="freeform")n+=responseTexts(s.id).length});return n+state.feed.filter(x=>x.kind==="reaction").length;
}
function addFeed(kind,text,rerender=true){state.feed=[{id:id(),kind,text,ts:now()},...state.feed].slice(0,50);saveLocal();if(rerender)render()}
async function firebaseInit(config){
 if(fb)return true;
 try{
   firebaseConfig=config;
   fb=initializeApp(config,"encore-"+Math.random().toString(36).slice(2));
   auth=getAuth(fb);db=getDatabase(fb);
   await signInAnonymously(auth);
   uid=auth.currentUser?.uid;
   if(!uid)throw new Error("Anonymous sign-in did not complete.");
   return true;
 }catch(e){console.error(e);toast("Firebase connection failed — check your config and Anonymous Auth.");fb=auth=db=null;uid=null;return false}
}
function decodeHashConfig(){
 const h=new URLSearchParams(location.hash.replace(/^#/,""));
 const cfg=h.get("cfg"),room=h.get("join");
 if(!cfg)return null;
 try{return {config:JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(cfg))))),room}}catch(e){return null}
}
function encodeConfig(config){return btoa(unescape(encodeURIComponent(JSON.stringify(config))))}
async function maybeAutoJoinConfig(){
 const h=decodeHashConfig();
 if(!h)return;
 const ok=await firebaseInit(h.config);if(!ok)return;
 firebaseConfig=h.config;localStorage.setItem(CFGKEY,JSON.stringify(h.config));
 state.room=h.room||null;state.view="participant";
 if(state.room)await loadRoomForAudience(state.room,false);
 render();
}
async function connectSavedConfig(){
 if(fb)return true;
 try{const c=JSON.parse(localStorage.getItem(CFGKEY)||"null");if(c)return await firebaseInit(c)}catch{}
 return false;
}
async function createOnlineRoom(){
 if(!await connectSavedConfig()){openSetup();return}
 const code=String(Math.floor(100000+Math.random()*900000));
 const roomRef=ref(db,"rooms/"+code);
 const payload={presenterUid:uid,createdAt:Date.now(),deck:{slides:state.slides},currentIndex:state.current,status:"active"};
 try{
   await set(roomRef,payload);
   state.online=true;state.room=code;state.presenter=true;state.participants=1;
   startPresenterListeners();saveLocal();render();toast("Online room created");
 }catch(e){console.error(e);toast("Could not create room — check Realtime Database rules.")}
}
function startPresenterListeners(){
 if(!db||!state.room||listenersStarted)return;listenersStarted=true;
 onValue(ref(db,`rooms/${state.room}/participants`),snap=>{state.participants=(snap.exists()?Object.keys(snap.val()).length:0)+1;render()});
 onValue(ref(db,`rooms/${state.room}/votes`),snap=>{state.remoteVotes=snap.val()||{};renderPresentationIfOpen();render()});
 onValue(ref(db,`rooms/${state.room}/responses`),snap=>{state.remoteResponses=snap.val()||{};renderPresentationIfOpen();render()});
 onChildAdded(ref(db,`rooms/${state.room}/events`),snap=>{
   if(remoteEventKeys.has(snap.key))return;remoteEventKeys.add(snap.key);
   const e=snap.val()||{};if(e.uid===uid)return;
   if(e.kind==="reaction")floatReaction(e.emoji||"👏");
   addFeed(e.kind||"activity",e.text||"Audience activity",false);render();
 });
}
async function syncDeck(){
 if(!state.online||!state.presenter||!db||!state.room)return;
 try{await update(ref(db,`rooms/${state.room}`),{deck:{slides:state.slides},currentIndex:state.current,status:"active"})}catch(e){console.warn("sync",e)}
}
async function loadRoomForAudience(code,joinNow=true){
 if(!db||!uid)return false;
 try{
   const snap=await get(ref(db,"rooms/"+code));
   if(!snap.exists()){toast("Room not found");return false}
   const data=snap.val();
   state.room=code;state.online=true;state.presenter=false;
   state.slides=data.deck?.slides||[];state.current=Number(data.currentIndex||0);
   if(joinNow){
     const name=(document.querySelector("#joinName")?.value||"").trim()||"Guest";
     state.joinedName=name;state.audienceJoined=true;
     await set(ref(db,`rooms/${code}/participants/${uid}`),{name,joinedAt:Date.now()});
     await emitEvent("join",`${name} joined the session.`);
   }
   startAudienceListeners();render();return true;
 }catch(e){console.error(e);toast("Could not join room");return false}
}
function startAudienceListeners(){
 if(!db||!state.room||listenersStarted)return;listenersStarted=true;
 onValue(ref(db,`rooms/${state.room}/deck/slides`),snap=>{if(snap.exists())state.slides=snap.val();render()});
 onValue(ref(db,`rooms/${state.room}/currentIndex`),snap=>{if(snap.exists())state.current=Number(snap.val()||0);render()});
 onValue(ref(db,`rooms/${state.room}/votes`),snap=>{state.remoteVotes=snap.val()||{};render()});
 onValue(ref(db,`rooms/${state.room}/responses`),snap=>{state.remoteResponses=snap.val()||{};render()});
}
async function emitEvent(kind,text,extra={}){
 if(!state.online||!db||!state.room||!uid)return;
 const er=push(ref(db,`rooms/${state.room}/events`));
 await set(er,{uid,kind,text,ts:Date.now(),...extra});
}
function floatReaction(e){const el=document.createElement("span");el.className="float";el.textContent=e;el.style.left=(8+Math.random()*80)+"%";document.body.appendChild(el);setTimeout(()=>el.remove(),2200)}
async function react(e,source){
 floatReaction(e);addFeed("reaction",(source||"Audience")+" sent "+e,false);render();
 if(state.online)await emitEvent("reaction",(source||state.joinedName||"Audience")+" sent "+e,{emoji:e});
}
function go(i){state.current=Math.max(0,Math.min(Number(i),state.slides.length-1));saveLocal();render();syncDeck();renderPresentationIfOpen()}
function view(v){state.view=v;saveLocal();render()}
function add(type){
 const title=prompt("Slide title:",type==="poll"?"New poll":type==="freeform"?"New question":"New slide");if(!title?.trim())return;
 if(type==="content"){state.slides.push({id:id(),type,title:title.trim(),body:prompt("Slide content:","Add your talking points here.")||"—"})}
 if(type==="poll"){const raw=prompt("Enter poll options separated by commas:","Option A, Option B");const opts=(raw||"").split(",").map(x=>x.trim()).filter(Boolean);if(opts.length<2){toast("A poll needs at least 2 options");return}state.slides.push({id:id(),type,title:title.trim(),options:opts.map(text=>({id:id(),text}))})}
 if(type==="freeform"){state.slides.push({id:id(),type,title:title.trim(),prompt:prompt("Audience prompt:","Answer in one word or a short phrase.")||"—"})}
 state.current=state.slides.length-1;saveLocal();render();syncDeck()
}
function editCurrent(){const s=current();if(!s)return;
 if(s.type==="content"){s.title=prompt("Title:",s.title)||s.title;s.body=prompt("Content:",s.body)||s.body}
 else if(s.type==="poll"){s.title=prompt("Poll title:",s.title)||s.title}
 else{s.title=prompt("Question title:",s.title)||s.title;s.prompt=prompt("Prompt:",s.prompt)||s.prompt}
 saveLocal();render();syncDeck()
}
function del(sid){if(state.slides.length<=1){toast("Keep at least one slide");return}const i=state.slides.findIndex(s=>s.id===sid);state.slides=state.slides.filter(s=>s.id!==sid);if(state.current>=state.slides.length)state.current=state.slides.length-1;else if(i<state.current)state.current--;saveLocal();render();syncDeck()}
async function audienceVote(optionId){
 const s=current();if(!s||s.type!=="poll")return;
 if(state.online){
   const vr=ref(db,`rooms/${state.room}/votes/${s.id}/${uid}`);
   const existing=await get(vr);if(existing.exists()){toast("You already voted on this slide");return}
   await set(vr,optionId);await emitEvent("vote",(state.joinedName||"A guest")+" voted.");
 }else{
   if(state.localVotes[s.id]?.demo){toast("This demo audience already voted");return}
   state.localVotes[s.id]={demo:optionId};saveLocal();render();
 }
}
async function submitWord(){
 const s=current(),input=document.querySelector("#audienceInput"),text=input?.value.trim();if(!s||s.type!=="freeform"||!text)return;
 input.value="";
 if(state.online){
   const rr=push(ref(db,`rooms/${state.room}/responses/${s.id}/${uid}`));await set(rr,text);await emitEvent("word",`${state.joinedName||"A guest"} answered: "${text}"`);
 }else{state.localResponses[s.id]=(state.localResponses[s.id]||[]).concat(text);saveLocal();render()}
}
function simVote(optionId){const s=current();if(!s||s.type!=="poll")return;const k="sim_"+id();state.localVotes[s.id]={...(state.localVotes[s.id]||{}),[k]:optionId};saveLocal();render();renderPresentationIfOpen()}
function simWord(){const s=current(),x=document.querySelector("#simInput"),t=x?.value.trim();if(!s||s.type!=="freeform"||!t)return;state.localResponses[s.id]=(state.localResponses[s.id]||[]).concat(t);x.value="";saveLocal();render();renderPresentationIfOpen()}
function pollResults(s){const counts=pollCounts(s),total=Object.values(counts).reduce((a,b)=>a+b,0);return '<div class="preview-poll">'+s.options.map(o=>{const n=counts[o.id]||0,pct=total?Math.round(n/total*100):0;return `<div class="barrow"><div class="barlabel"><span>${esc(o.text)}</span><span>${n} · ${pct}%</span></div><div class="bar"><div class="fill" style="width:${pct}%"></div></div></div>`}).join("")+"</div>"}
function wordCloud(s){const arr=responseTexts(s.id);if(!arr.length)return '<div class="empty">Answers will appear here as the audience responds.</div>';const f={};arr.forEach(v=>{const k=String(v).trim().toLowerCase();if(k)f[k]=(f[k]||0)+1});const a=Object.entries(f).sort((x,y)=>y[1]-x[1]),mx=Math.max(...a.map(x=>x[1])),mn=Math.min(...a.map(x=>x[1]));return '<div class="wordcloud">'+a.map(([t,n])=>{const size=mx===mn?30:17+(n-mn)/(mx-mn)*37;return `<span class="word" style="font-size:${size}px">${esc(t)}</span>`}).join("")+"</div>"}
function hero(s){if(!s)return '<div class="empty">No slides yet.</div>';if(s.type==="content")return `<h1>${esc(s.title)}</h1><p>${esc(s.body)}</p>`;if(s.type==="poll")return `<h1>${esc(s.title)}</h1>${pollResults(s)}`;return `<h1>${esc(s.title)}</h1><p>${esc(s.prompt)}</p>${wordCloud(s)}`}
function sidebar(){return `<aside class="sidebar"><div class="rundown">☷ Rundown</div><div class="slides">${state.slides.map((s,i)=>`<button class="slideitem ${i===state.current?"active":""}" onclick="Encore.go(${i})"><span class="slide-num">${i+1}</span><span>${({content:"▤",poll:"▥",freeform:"☁"}[s.type])}</span><span class="slide-title">${esc(s.title||"Untitled")}</span><span class="delete" onclick="event.stopPropagation();Encore.del('${s.id}')">×</span></button>`).join("")}</div><div class="addbox"><div class="addgrid"><button class="addbtn" onclick="Encore.add('content')">＋<br>Standard</button><button class="addbtn" onclick="Encore.add('poll')">＋<br>Poll</button><button class="addbtn" onclick="Encore.add('freeform')">＋<br>Word Cloud</button></div></div></aside>`}
function invitePanel(){
 if(state.online&&state.presenter){
   const base=location.href.split("#")[0],link=base+"#join="+state.room+"&cfg="+encodeURIComponent(encodeConfig(firebaseConfig));
   window.__encoreJoinLink=link;
   return `<div class="invite"><div style="font-size:11px;font-weight:850;color:var(--blue)">LIVE ROOM</div><div class="row"><div><span class="room">${state.room}</span><span class="muted"> · ${state.participants} connected</span></div><div style="display:flex;gap:7px"><button class="smallbtn" onclick="Encore.copyRoom()">Copy code</button><button class="smallbtn" onclick="Encore.copyLink()">Copy join link</button></div></div><div class="muted" style="font-size:11px;margin-top:5px">Open the join link on any phone or laptop. Everyone uses this same Encore page.</div></div>`
 }
 return `<div class="invite"><div style="font-size:11px;font-weight:850;color:var(--blue)">ONLINE PRESENTATION</div><div class="row"><div><b>${fb?"Firebase connected":"Local demo mode"}</b><div class="muted" style="font-size:11px;margin-top:3px">${fb?"Create a room when you are ready to invite an audience.":"Connect the free backend once, then create real live rooms."}</div></div><button class="smallbtn" onclick="${fb?"Encore.createRoom()":"Encore.openSetup()"}">${fb?"Create live room":"Set up free live sync"}</button></div></div>`
}
function presenter(){
 const s=current();
 return `<section class="presenter">${sidebar()}<div class="console"><div class="hero">${hero(s)}</div><div class="content">${invitePanel()}<div class="metrics"><div class="metric"><div class="metric-label">Current Deck</div><div class="metric-value">${esc((s?.title||"—").slice(0,22).toUpperCase())}</div></div><div class="metric center"><div class="metric-label">Total Inputs</div><div class="metric-value">${totalInputs()} received</div></div><div class="metric right"><div class="metric-label">Session</div><div class="metric-value" style="color:var(--green)">${state.online?"LIVE":"Ready"}</div></div></div><h3 class="section-title">Presenter Navigation</h3><div class="actions"><button class="action" onclick="Encore.go(${state.current-1})" ${state.current<=0?"disabled":""}>← Previous</button><button class="action primary" onclick="Encore.go(${state.current+1})" ${state.current>=state.slides.length-1?"disabled":""}>Next →</button><button class="action" onclick="Encore.edit()">✎ Edit</button><button class="action caramel" onclick="Encore.present()">⛶ Present Full Screen</button></div><h3 class="section-title">Test Engagement</h3><div class="actions">${s?.type==="poll"?s.options.map(o=>`<button class="action" onclick="Encore.simVote('${o.id}')">+ Vote “${esc(o.text)}”</button>`).join(""):s?.type==="freeform"?'<input id="simInput" placeholder="Type a test answer…" style="flex:1;min-width:220px;padding:10px;border:1px solid var(--border);border-radius:10px"><button class="action primary" onclick="Encore.simWord()">Add answer</button>':'<span class="muted" style="font-size:12px">Choose a poll or word-cloud slide to test inputs.</span>'}</div><h3 class="section-title">Reactions</h3><div class="reactbar">${EMOJIS.map(e=>`<button class="react" onclick="Encore.react('${e}','Presenter')">${e}</button>`).join("")}</div><div class="feed"><div class="feed-head"><b>Live Activity Feed</b><span class="muted">${state.online?"Firebase live":"Local demo"}</span></div><div class="feed-body">${state.feed.map(f=>`<div class="feeditem"><div><div class="feedkind">${f.kind==="system"?"Host":"Audience"}</div><div>${esc(f.text)}</div></div><span class="time">${f.ts}</span></div>`).join("")}</div></div></div></div></section>`
}
function myVoteFor(s){
 const vm=voteMap(s.id);if(state.online&&uid)return vm[uid]||null;return vm.demo||null
}
function audience(){
 const s=current();
 if(!state.online){
   return `<section class="audience"><div class="audience-center"><div class="audience-card join"><div class="brandmark">◉</div><h2>Audience preview</h2><p>This is the local test view. For real multi-device voting, use <b>Set up free live sync</b> in Presenter mode.</p><button class="primary" style="width:100%" onclick="Encore.previewJoin()">Enter local preview</button></div></div></section>`
 }
 if(!state.audienceJoined){
   return `<section class="audience"><div class="audience-center"><div class="audience-card join"><div class="brandmark">◉</div><h2>Join this session</h2><p>Room code</p><input id="joinCode" class="code" maxlength="6" value="${esc(state.room||"")}" placeholder="123456"><input id="joinName" class="name" placeholder="Your name (optional)"><button class="primary" style="width:100%;margin-top:7px" onclick="Encore.joinOnline()">Join session</button></div></div></section>`
 }
 return `<section class="audience"><div class="audience-center">${!s?'<div class="empty">Waiting for the presenter…</div>':`<div class="audience-card"><div class="type">${({content:"Standard",poll:"Poll",freeform:"Word Cloud"}[s.type])}</div><h2>${esc(s.title)}</h2>${s.type==="content"?`<p>${esc(s.body)}</p>`:s.type==="poll"?`<div>${s.options.map(o=>`<button class="poll-option ${myVoteFor(s)===o.id?"selected":""}" onclick="Encore.vote('${o.id}')" ${myVoteFor(s)?"disabled":""}>${esc(o.text)}${myVoteFor(s)===o.id?" ✓":""}</button>`).join("")}${myVoteFor(s)?'<p style="font-size:12px">Thanks — your vote is in.</p>':""}</div>`:`<div><p>${esc(s.prompt)}</p><div style="display:flex;gap:7px"><input id="audienceInput" placeholder="Type your answer…" onkeydown="if(event.key==='Enter')Encore.submit()"><button class="primary" onclick="Encore.submit()">Send</button></div></div>`}</div>`}</div><div class="reaction-footer">${EMOJIS.map(e=>`<button class="react" onclick="Encore.react('${e}','${esc(state.joinedName||"Audience")}')">${e}</button>`).join("")}</div></section>`
}
function render(){
 document.querySelector("#app").innerHTML=`<div class="app"><header class="topbar"><div class="brand"><span class="brandmark">◉</span>Encore</div><div class="tabs"><button class="tab ${state.view==="presenter"?"active":""}" onclick="Encore.view('presenter')">Presenter</button><button class="tab ${state.view==="split"?"active":""}" onclick="Encore.view('split')">Split test</button><button class="tab ${state.view==="participant"?"active":""}" onclick="Encore.view('participant')">Audience</button></div><div class="top-actions"><span class="status ${state.online?"online":""}">${state.online?"● LIVE":"○ LOCAL"}</span><button class="iconbtn optional" onclick="Encore.openSetup()">⚙ Live setup</button><button class="iconbtn" onclick="Encore.present()">⛶ Present</button></div></header><main class="main ${state.view}">${state.view!=="participant"?presenter():""}${state.view!=="presenter"?audience():""}</main></div>`
}
function renderPresentationIfOpen(){if(document.getElementById("presentation"))present(false)}
function present(requestFs=true){
 const s=current();if(!s)return;document.getElementById("presentation")?.remove();
 const d=document.createElement("div");d.id="presentation";d.className="presentation";d.innerHTML=`<div class="stage"><div class="stage-inner">${hero(s)}</div></div><div class="present-counter">${state.current+1} / ${state.slides.length}</div><div class="present-controls"><button onclick="Encore.prevPresent()">←</button><button onclick="Encore.nextPresent()">→</button><button onclick="Encore.closePresent()">Close</button></div>`;document.body.appendChild(d);
 if(requestFs)d.requestFullscreen?.().catch(()=>{});
}
function closePresent(){document.getElementById("presentation")?.remove();document.exitFullscreen?.().catch(()=>{})}
function openSetup(){
 const saved=localStorage.getItem(CFGKEY)||"";
 const rules=`{
  "rules": {
    "rooms": {
      "$room": {
        ".read": "auth != null",
        ".write": "auth != null && ((!data.exists() && newData.child('presenterUid').val() === auth.uid) || data.child('presenterUid').val() === auth.uid)",
        "participants": {
          "$uid": { ".write": "auth != null && auth.uid === $uid" }
        },
        "votes": {
          "$slide": {
            "$uid": { ".write": "auth != null && auth.uid === $uid && !data.exists()" }
          }
        },
        "responses": {
          "$slide": {
            "$uid": {
              "$response": { ".write": "auth != null && auth.uid === $uid" }
            }
          }
        },
        "events": {
          "$event": { ".write": "auth != null && newData.child('uid').val() === auth.uid" }
        }
      }
    }
  }
}`;
 window.__encoreRules=rules;
 const m=document.createElement("div");m.id="setup";m.className="modal-wrap";m.innerHTML=`<div class="setup-modal"><h2>Free live-sync setup</h2><div class="notice">This uses Firebase Spark. You do not need a payment method for the Spark plan. Encore only needs Anonymous Authentication + Realtime Database.</div><h3>1 — In Firebase</h3><p>Create a Firebase project, add a <b>Web App</b>, enable <b>Authentication → Anonymous</b>, then create a <b>Realtime Database</b>.</p><h3>2 — Paste these database rules</h3><textarea readonly>${esc(rules)}</textarea><button class="smallbtn" onclick="Encore.copyRules()">Copy rules</button><h3>3 — Paste your Firebase config object</h3><p>Copy the <code>firebaseConfig</code> object from Project settings → Your apps. Paste either the object itself or just its JSON contents.</p><textarea id="cfgInput" placeholder='{"apiKey":"...","authDomain":"...","databaseURL":"...","projectId":"...","appId":"..."}'>${esc(saved)}</textarea><div class="setup-actions"><button class="ghost" onclick="document.getElementById('setup').remove()">Cancel</button><button class="primary" onclick="Encore.saveConfig()">Save & connect</button></div></div>`;document.body.appendChild(m)
}
async function saveConfig(){
 let raw=document.querySelector("#cfgInput")?.value.trim();if(!raw)return;
 raw=raw.replace(/^const\s+firebaseConfig\s*=\s*/,"").replace(/^var\s+firebaseConfig\s*=\s*/,"").replace(/;$/,"");
 try{
   let cfg;
   try{cfg=JSON.parse(raw)}catch{
     cfg=Function('"use strict";return ('+raw+')')();
   }
   if(!cfg.apiKey||!cfg.projectId||!cfg.appId||!cfg.databaseURL)throw new Error("Missing required fields");
   localStorage.setItem(CFGKEY,JSON.stringify(cfg));
   const ok=await firebaseInit(cfg);if(ok){document.getElementById("setup")?.remove();render();toast("Firebase connected")}
 }catch(e){console.error(e);toast("Could not read that Firebase config")}
}
async function joinOnline(){const code=(document.querySelector("#joinCode")?.value||"").trim();if(code.length!==6){toast("Enter the 6-digit room code");return}await loadRoomForAudience(code,true)}
function previewJoin(){state.audienceJoined=true;state.joinedName="Preview";render()}
function copyText(t,label){navigator.clipboard?.writeText(t).then(()=>toast(label)).catch(()=>toast("Copy failed — select and copy manually"))}

window.Encore={
 go,view,add,edit:editCurrent,del,react,simVote,simWord,vote:audienceVote,submit:submitWord,present:()=>present(true),
 prevPresent:()=>{go(state.current-1);present(false)},nextPresent:()=>{go(state.current+1);present(false)},closePresent,
 openSetup,saveConfig,createRoom:createOnlineRoom,joinOnline,previewJoin,
 copyRules:()=>copyText(window.__encoreRules||"","Rules copied"),
 copyRoom:()=>copyText(state.room||"","Room code copied"),
 copyLink:()=>copyText(window.__encoreJoinLink||"","Join link copied"),
 reset:()=>{localStorage.removeItem(LS);location.reload()}
};
window.addEventListener("keydown",e=>{if(!document.getElementById("presentation"))return;if(e.key==="Escape"){closePresent();return}if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();Encore.nextPresent()}if(e.key==="ArrowLeft"){e.preventDefault();Encore.prevPresent()}});
window.addEventListener("beforeunload",saveLocal);
render();
await maybeAutoJoinConfig();
</script>
</body>
</html>
